[package]
name = "rain-vats-flare"
version = "0.1.1"

[profile.default]
libs = ['dependencies']

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false

remappings = [
  # Third-party soldeer deps whose own source uses unversioned import
  # prefixes; bridge to their actual install location so transitive
  # resolution works. Tracked upstream:
  # - OpenZeppelin/openzeppelin-contracts-upgradeable#232
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/",
]

[dependencies]
# rain-vats supplies the base contracts this repo's Flare oracles extend
# (PriceOracleV2) and the vault the integration test exercises
# (ERC20PriceOracleReceiptVault). The rest mirror rain-vats's own set because
# compiling the vault pulled in from rain-vats requires its transitive imports
# to resolve here too.
"rain-vats" = "0.2.7"
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"
"@openzeppelin-contracts-upgradeable" = "5.7.0"
"rain-extrospection" = "0.1.14"
"rain-factory" = "0.2.4"
"rain-flare" = "0.1.4"
"rain-math-fixedpoint" = "0.2.2"
"rain-math-float" = "0.3.10"
"rain-string" = "0.3.9"
"rain-verify-interface" = "0.1.0"
"solady" = "0.1.26"

[soldeer]
recursive_deps = false

[rpc_endpoints]
flare = "${FLARE_RPC_URL}"
